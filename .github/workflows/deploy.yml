name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migration:
        description: 'Skip database migration'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.meta-api.outputs.tags }}
      web_image: ${{ steps.meta-web.outputs.tags }}
      version: ${{ steps.meta-api.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ !inputs.skip_migration }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: apps/api
        run: uv pip install --system -e .

      - name: Run migration safety checks (dry-run)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python scripts/migrate.py upgrade --dry-run

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          python scripts/migrate.py upgrade --no-backup-check
        # Note: --no-backup-check is used because backup verification
        # should be handled by your database provider's automated backups
        # For AWS RDS, enable automated backups in your Terraform config

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    if: always() && needs.build-and-push.result == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment summary
        run: |
          cat << EOF > deployment-summary.md
          # Deployment Summary

          **Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Docker Images

          ### API
          \`\`\`
          ${{ needs.build-and-push.outputs.api_image }}
          \`\`\`

          ### Web
          \`\`\`
          ${{ needs.build-and-push.outputs.web_image }}
          \`\`\`

          ## Migration Status

          ${{ needs.migrate.result == 'success' && '✅ Database migrations applied successfully' || needs.migrate.result == 'skipped' && '⏭️ Migrations skipped' || '❌ Migration failed - review logs' }}

          ## Manual Deployment Commands

          To deploy these images manually:

          \`\`\`bash
          # Pull the images
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest

          # Run with docker-compose or your orchestrator
          # See docs/deployment.md for details
          \`\`\`

          ## Next Steps for AWS (Step 11)

          These images are ready to be deployed to AWS ECS Fargate.
          When implementing Terraform (step 11), reference these image URIs.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: deploy-${{ github.run_number }}
          name: Deployment ${{ github.run_number }}
          body_path: deployment-summary.md
          draft: false
          prerelease: false
