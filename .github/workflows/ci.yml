name: CI

on:
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (Biome + Vitest + Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Biome (lint)
        run: pnpm lint
      - name: TypeScript (typecheck)
        run: pnpm typecheck
      - name: Vitest (unit tests)
        run: pnpm test
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Playwright (e2e tests)
        run: pnpm e2e

  api:
    name: API (Ruff + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff (format check)
        run: python -m ruff format --check .
      - name: Ruff (lint)
        run: python -m ruff check .
      - name: Pytest
        run: python -m pytest -q

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: false
          tags: fullstack-template-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          target: production
          push: false
          tags: fullstack-template-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test API image health
        run: |
          docker run -d --name api-test -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./test.db \
            -e JWT_SECRET=test-secret \
            fullstack-template-api:test
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker logs api-test
          docker stop api-test

      - name: Test Web image startup
        run: |
          docker run -d --name web-test -p 3000:3000 \
            -e NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1 \
            fullstack-template-web:test
          sleep 15
          # Check that the container is still running (didn't crash)
          docker ps | grep web-test || exit 1
          docker logs web-test
          docker stop web-test
